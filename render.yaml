services:
  - type: web
    name: mawid-appointments
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mawid-database
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_SETUP_KEY
        generateValue: true

databases:
  - name: mawid-database
    databaseName: mawid
    user: mawid
