<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer"><title>إعداد حسابات الأطباء | موعد</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(140deg,#f3f8f3,#f8eee6);color:#172d2a;font:15px Arial,sans-serif}.card{width:min(700px,100%);padding:30px;background:white;border:1px solid #e3ece4;border-radius:20px;box-shadow:0 20px 60px #214d3817}h1{margin:0 0 8px;color:#1d6354;font-size:24px}.lead,.notice{color:#708078;line-height:1.8;font-size:14px}.lock{display:inline-grid;place-items:center;width:50px;height:50px;margin-bottom:16px;border-radius:15px;background:#e9f3eb;color:#1d6354;font-size:25px}label{display:block;margin:20px 0 8px;font-weight:bold;font-size:13px}input{width:100%;padding:13px;border:1px solid #dce7de;border-radius:9px;font:inherit}button{margin-top:14px;padding:13px 18px;border:0;border-radius:9px;background:#1d6354;color:white;font:inherit;font-weight:bold;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.msg{margin-top:14px;color:#a35943;font-size:13px}.result{margin-top:22px}.result table{width:100%;border-collapse:collapse;font-size:13px}.result th,.result td{padding:10px;border-bottom:1px solid #e8eee8;text-align:right}.result code{display:inline-block;direction:ltr;padding:5px 7px;background:#f0f5f0;border-radius:5px;user-select:all}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{background:#e9f3eb;color:#1d6354}.notice{padding:12px 14px;margin-top:18px;border-radius:9px;background:#fff5e9;color:#845d42;font-size:12px}#result[hidden]{display:none}
  </style>
</head>
<body><main class="card"><div class="lock">✚</div><h1>إعداد كلمات مرور الأطباء</h1><p class="lead">هذه الصفحة للمسؤول فقط. أدخل مفتاح الإعداد الموجود في إعدادات الاستضافة لإنشاء كلمة مرور مستقلة لكل طبيب.</p><form id="setup"><label for="key">مفتاح إعداد المسؤول</label><input id="key" type="password" autocomplete="off" required><button id="submit" type="submit">إنشاء كلمات المرور مرة واحدة</button></form><p class="msg" id="message" role="status"></p><section class="result" id="result" hidden><div class="notice">انسخ القائمة أو نزّلها واحفظها الآن. بعد مغادرة الصفحة لن يمكن عرض كلمات المرور مرة ثانية.</div><div class="actions"><button id="copy" type="button">نسخ القائمة</button><button id="download" type="button">تنزيل القائمة</button></div><div id="table"></div></section></main>
<script>
const form=document.querySelector('#setup'),key=document.querySelector('#key'),button=document.querySelector('#submit'),message=document.querySelector('#message'),result=document.querySelector('#result'),table=document.querySelector('#table');let text='';
fetch('/api/admin/status').then(r=>r.json()).then(s=>{if(s.initialized){form.hidden=true;message.textContent='تم إنشاء كلمات المرور من قبل. لا يمكن عرضها مجددًا من هذه الصفحة.'}}).catch(()=>message.textContent='تعذر الاتصال بالخادم.');
form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;message.textContent='جارٍ إنشاء كلمات المرور…';try{const response=await fetch('/api/admin/bootstrap',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Setup-Key':key.value},body:'{}'}),data=await response.json();if(!response.ok)throw new Error(data.error||'تعذر إنشاء الحسابات.');text=data.credentials.map(x=>`${x.doctor} — ${x.specialty}: ${x.password}`).join('\n');table.innerHTML='<table><thead><tr><th>الطبيب</th><th>التخصص</th><th>كلمة المرور</th></tr></thead><tbody>'+data.credentials.map(x=>`<tr><td>${escapeHtml(x.doctor)}</td><td>${escapeHtml(x.specialty)}</td><td><code>${escapeHtml(x.password)}</code></td></tr>`).join('')+'</tbody></table>';result.hidden=false;form.hidden=true;message.textContent='تم إنشاء الحسابات.'}catch(error){message.textContent=error.message;button.disabled=false}});
function escapeHtml(v){const e=document.createElement('span');e.textContent=v;return e.innerHTML}
document.querySelector('#copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(text);message.textContent='تم نسخ القائمة.'}catch{message.textContent='لم يسمح المتصفح بالنسخ؛ حدّد كلمات المرور وانسخها يدويًا.'}});
document.querySelector('#download').addEventListener('click',()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/plain;charset=utf-8'}));a.download='كلمات-مرور-الأطباء.txt';a.click();URL.revokeObjectURL(a.href)});
</script></body></html>
